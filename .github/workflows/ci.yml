name: CI

on:
  push:
    branches: [main, development, production, "cursor/**"]
  pull_request:
    branches: [main, development, production]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Orient.Pipelink.slnx

      - name: Build
        run: dotnet build Orient.Pipelink.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Orient.Pipelink.slnx --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack src/Orient.Pipelink/Orient.Pipelink.csproj --no-build -c Release -o ./artifacts/packages

      - name: Validate package
        run: bash ./build/validate-packages.sh ./artifacts/packages

      - name: Verify package in fresh Console, Worker and Web API projects
        run: bash ./build/verify-consumer.sh ./artifacts/packages
