name: Publish to NuGet

# Release by pushing a tag that matches <Version> in Pipelink/Pipelink.csproj, e.g. v2.0.0.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for NuGet Trusted Publishing (OIDC token exchange)
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version=$(dotnet msbuild Pipelink/Pipelink.csproj -getProperty:Version)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Project version: $project_version, tag version: $tag_version"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$project_version</Version> in Pipelink/Pipelink.csproj"
            exit 1
          fi

      - name: Restore
        run: dotnet restore pipelink.sln

      - name: Build
        run: dotnet build pipelink.sln --no-restore -c Release

      - name: Test
        run: dotnet test pipelink.sln --no-build -c Release

      - name: Pack
        run: dotnet pack Pipelink/Pipelink.csproj --no-build -c Release -o ./nupkg

      # Exchanges the GitHub OIDC token for a short-lived NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org pointing at this repo and workflow file.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: burak-seyhan

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
